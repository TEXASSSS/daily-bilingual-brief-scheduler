name: Daily brief scheduler
on:
  schedule:
    - cron: '*/5 * * * *'
permissions: {}
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify native schedule delivery before activation
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node -e 'console.log(JSON.stringify({event:process.env.EVENT_NAME,runId:process.env.RUN_ID,observedAt:new Date().toISOString(),status:"scheduler_probe"}))'
